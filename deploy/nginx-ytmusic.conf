# API ytmusic. Ставится в /etc/nginx/sites-available/ytmusic и линкуется
# в sites-enabled. TLS добавляет certbot (--nginx), поэтому здесь только
# http-версия: certbot допишет 443-й блок и редирект сам.

server {
    listen 80;
    listen [::]:80;
    server_name ytmusic.82-70-63-136.nip.io;

    # Оставляем certbot путь для обновления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Импорт с ютуба сейчас синхронный: yt-dlp качает, ffmpeg жмёт,
        # файл уезжает в R2. До 180 секунд по таймауту мобильного клиента,
        # поэтому здесь запас. Когда импорт уедет в celery — можно вернуть 60s.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;

        # Аудио и обложки клиент забирает напрямую из R2 по presigned-ссылкам,
        # через nginx ходят только JSON-запросы — большой body не нужен.
        client_max_body_size 8M;
    }
}
